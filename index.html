<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent QA Report</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --border: #e1e5f2;
      --primary: #1976d2;
      --primary-dark: #1458a1;
      --accent: #4caf50;
      --radius-lg: 14px;
      --radius-sm: 8px;
      --shadow-soft: 0 10px 25px rgba(15, 23, 42, 0.08);
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: var(--font-main);
      background: radial-gradient(circle at top left, #e3f2fd 0, #f5f7fb 55%, #edf1ff 100%);
      color: #1f2933;
    }
    .shell { max-width: 1120px; margin: 0 auto; }
    .topbar {
      background: linear-gradient(135deg, #1976d2, #673ab7);
      color: #fff;
      border-radius: 18px;
      padding: 16px 22px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 18px;
    }
    .topbar-title { font-size: 22px; font-weight: 700; }
    .topbar-sub { font-size: 13px; margin-top: 4px; opacity: 0.9; }
    .main { display: flex; flex-direction: column; gap: 14px; }
    .panel {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 16px 18px 18px;
      box-shadow: var(--shadow-soft);
      border: 1px solid #edf0f6;
    }
    .panel-title { margin: 0 0 10px; font-size: 15px; font-weight: 700; }
    label {
      display: block;
      margin-top: 8px;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 600;
      color: #425466;
    }
    input[type="date"] {
      width: 100%;
      padding: 8px 9px;
      border-radius: var(--radius-sm);
      border: 1px solid #cbd2e1;
      background: #f9fafb;
      font-size: 13px;
    }
    input[type="date"]:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.18);
    }
    .date-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 720px) {
      body { padding: 12px; }
      .date-row { grid-template-columns: 1fr; }
    }
    button {
      margin-top: 14px;
      padding: 9px 16px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
    }
    button:disabled {
      background: #b7c5d8;
      cursor: not-allowed;
      box-shadow: none;
    }
    #status {
      margin-top: 6px;
      font-size: 12px;
      color: #5f6c80;
    }
    #summary h2, #calls h2 { margin-top: 0; font-size: 15px; font-weight: 700; }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      margin-top: 8px;
    }
    th, td {
      padding: 5px 7px;
      border: 1px solid var(--border);
      vertical-align: top;
    }
    th {
      background: #f3e5f5;
      text-align: left;
      font-weight: 600;
      color: #45275b;
    }
    .category-header {
      background: #f3e5f5;
      font-weight: 600;
      padding: 6px 8px;
      margin-top: 12px;
      border-radius: 6px 6px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .good-row { background: #f5fbf6; }
    .issue-row { background: #fff7f7; }
    .summary-box {
      white-space: pre-wrap;
      font-size: 13px;
      background: #f1f8e9;
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid var(--accent);
      line-height: 1.5;
    }
    #disputeDialog {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-title">Agent QA Report</div>
      <div class="topbar-sub">This dashboard shows only your own QA data (based on your login).</div>
    </header>

    <main class="main">
      <section class="panel">
        <h2 class="panel-title">Filters</h2>

        <label>Agent</label>
        <div id="agentDisplay"
             style="font-size:13px; font-weight:600; padding:6px 8px; background:#f9fafb; border-radius:8px;">
          Your dashboard (login-based)
        </div>

        <div class="date-row">
          <div>
            <label for="from">From Date</label>
            <input id="from" type="date">
          </div>
          <div>
            <label for="to">To Date</label>
            <input id="to" type="date">
          </div>
        </div>

        <button id="runBtn" onclick="runReport()">🔍 Generate Report</button>
        <div id="status">Select dates and click Generate report.</div>
      </section>

      <section id="summary" class="panel" style="display:none;"></section>
      <section id="calls" class="panel" style="display:none;"></section>
      <section id="disputesPanel" class="panel" style="display:none;"></section>
    </main>
  </div>

  <!-- SIMPLE dispute popup and resolution popup omitted here for brevity; you can keep your existing ones if they work -->

  <script>
    const SCRIPT_URL = "https://script.google.com/a/macros/voltmoney.in/s/AKfycbxnottuUJ8uDxE5IuDdpvXGoKbs14Sk4M_5jtOWwhcFu73NyJ8FWodl5SoA_V99V5vh/exec";

    async function safeJson(res) {
      const text = await res.text();
      try { return JSON.parse(text); }
      catch { throw new Error("Not JSON: " + text.slice(0,80)); }
    }

    function runReport() {
      const from  = document.getElementById('from').value;
      const to    = document.getElementById('to').value;
      const status = document.getElementById('status');
      const btn    = document.getElementById('runBtn');

      if (!from || !to) {
        status.textContent = "Please select From and To dates.";
        return;
      }

      status.textContent = "Running...";
      btn.disabled = true;

      const url = `${SCRIPT_URL}?from=${from}&to=${to}`;

      fetch(url)
        .then(r => safeJson(r))
        .then(async data => {
          if (!data.ok) {
            status.textContent = "Error: " + (data.error || "Unknown error");
            return;
          }

          renderSummary(data);
          renderCallsGrouped(data.calls);
          status.textContent = "Done.";
        })
        .catch(err => {
          status.textContent = "Failed: " + err.message;
        })
        .finally(() => {
          btn.disabled = false;
        });
    }

    function renderSummary(data) {
      const summaryDiv = document.getElementById('summary');
      summaryDiv.style.display = 'block';

      const agentDisplay = document.getElementById('agentDisplay');
      if (agentDisplay) agentDisplay.textContent = data.agent;

      summaryDiv.innerHTML = `
        <h2>Performance Summary</h2>
        <table>
          <tr><td style="font-weight:bold;width:130px;">Agent</td><td>${data.agent}</td></tr>
          <tr><td style="font-weight:bold;">Total audits</td><td>${data.totalAudits}</td></tr>
          <tr><td style="font-weight:bold;">Average score</td><td>${data.averageScore}%</td></tr>
          <tr><td style="font-weight:bold;">Period</td><td>${data.period}</td></tr>
        </table>`;
    }

    function renderCallsGrouped(calls) {
      const callsDiv = document.getElementById('calls');
      callsDiv.style.display = 'block';

      if (!calls || !calls.length) {
        callsDiv.innerHTML = "<h2>Call-by-call breakdown</h2><p>No calls in this period.</p>";
        return;
      }

      const groups = {};
      calls.forEach(c => {
        const cat = c.queryType || "Other";
        if (!groups[cat]) groups[cat] = [];
        groups[cat].push(c);
      });

      let html = '<h2>Call-by-call breakdown</h2>';

      Object.keys(groups).forEach(cat => {
        const list = groups[cat];
        html += `
          <div class="category-header">
            <span>${cat.toUpperCase()}</span>
            <span class="count">${list.length} calls</span>
          </div>
          <table><thead>
            <tr><th>SL No</th><th>Category</th><th>Score</th><th>Feedback</th></tr>
          </thead><tbody>`;

        list.forEach(c => {
          html += `
            <tr>
              <td style="text-align:center;">${c.slNo}</td>
              <td>${c.queryType || ""}</td>
              <td style="text-align:center;">${c.score}%</td>
              <td>${(c.feedback || "").replace(/\\n/g,"<br>")}</td>
            </tr>`;
        });

        html += "</tbody></table>";
      });

      callsDiv.innerHTML = html;
    }

    window.addEventListener('load', () => {
      document.getElementById('status').textContent =
        "Select dates and click Generate report. This dashboard is tied to your login.";
    });
  </script>
</body>
</html>
