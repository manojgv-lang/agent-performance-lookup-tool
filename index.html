<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent QA Report</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --border: #e1e5f2;
      --primary: #1976d2;
      --primary-dark: #1458a1;
      --accent: #4caf50;
      --radius-lg: 14px;
      --radius-sm: 8px;
      --shadow-soft: 0 10px 25px rgba(15, 23, 42, 0.08);
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: var(--font-main);
      background: radial-gradient(circle at top left, #e3f2fd 0, #f5f7fb 55%, #edf1ff 100%);
      color: #1f2933;
    }

    .shell {
      max-width: 1120px;
      margin: 0 auto;
    }

    .topbar {
      background: linear-gradient(135deg, #1976d2, #673ab7);
      color: #fff;
      border-radius: 18px;
      padding: 16px 22px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 18px;
    }

    .topbar-title {
      font-size: 22px;
      font-weight: 700;
    }

    .topbar-sub {
      font-size: 13px;
      margin-top: 4px;
      opacity: 0.9;
    }

    .main {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 16px 18px 18px;
      box-shadow: var(--shadow-soft);
      border: 1px solid #edf0f6;
    }

    .panel-filters {
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }

    label {
      display: block;
      margin-top: 8px;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 600;
      color: #425466;
    }

    select,
    input[type="date"],
    input[type="password"] {
      width: 100%;
      padding: 8px 9px;
      border-radius: var(--radius-sm);
      border: 1px solid #cbd2e1;
      background: #f9fafb;
      font-size: 13px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    select:focus,
    input[type="date"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.18);
    }

    .date-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width: 720px) {
      body { padding: 12px; }
      .date-row { grid-template-columns: 1fr; }
    }

    button {
      margin-top: 14px;
      padding: 9px 16px;
      border: none;
      border-radius: 999px;
      background: var(--primary);
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(25, 118, 210, 0.3);
    }

    button:disabled {
      background: #b7c5d8;
      cursor: not-allowed;
      box-shadow: none;
    }

    #status {
      margin-top: 6px;
      font-size: 12px;
      color: #5f6c80;
    }

    #summary h2,
    #calls h2 {
      margin-top: 0;
      font-size: 15px;
      font-weight: 700;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 12px;
      margin-top: 8px;
    }

    th,
    td {
      padding: 5px 7px;
      border: 1px solid var(--border);
      vertical-align: top;
    }

    th {
      background: #f3e5f5;
      text-align: left;
      font-weight: 600;
      color: #45275b;
    }

    .category-header {
      background: #f3e5f5;
      font-weight: 600;
      padding: 6px 8px;
      margin-top: 12px;
      border-radius: 6px 6px 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }

    .category-header span.count {
      font-weight: 500;
      color: #5f6c80;
    }

    .good-row {
      background: #f5fbf6;
    }

    .issue-row {
      background: #fff7f7;
    }

    .summary-box {
      white-space: pre-wrap;
      font-size: 13px;
      background: #f1f8e9;
      border-radius: 8px;
      padding: 10px 12px;
      border-left: 4px solid var(--accent);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="topbar-title">Agent QA Report</div>
      <div class="topbar-sub">Select your name, enter password and dates, then generate your QA report.</div>
    </header>

    <main class="main">
      <section class="panel panel-filters">
        <h2 class="panel-title">Filters</h2>

        <label for="agent">Agent</label>
        <select id="agent">
          <option value="">Loading...</option>
        </select>

        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password">

        <div class="date-row">
          <div>
            <label for="from">From Date</label>
            <input id="from" type="date">
          </div>
          <div>
            <label for="to">To Date</label>
            <input id="to" type="date">
          </div>
        </div>

        <button id="runBtn" onclick="runReport()">🔍 Generate Report</button>
        <div id="status">Waiting...</div>
      </section>

      <section id="summary" class="panel" style="display:none;"></section>
      <section id="calls" class="panel" style="display:none;"></section>
    </main>
  </div>

  <script>
    // Use your Apps Script EXEC_URL here
    const SCRIPT_URL = "EXEC_URL_HERE";

    async function safeJson(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch (e) {
        throw new Error("Not JSON: " + text.slice(0, 80));
      }
    }

    async function init() {
      const agentSelect = document.getElementById('agent');
      const status = document.getElementById('status');

      status.textContent = "Loading agents...";

      try {
        const res = await fetch(`${SCRIPT_URL}?listAgents=1`);
        const data = await safeJson(res);

        if (!data.ok) {
          status.textContent = "Error loading agents: " + (data.error || "Unknown error");
          return;
        }

        agentSelect.innerHTML = '<option value="">Select agent…</option>';

        (data.agents || []).forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          agentSelect.appendChild(opt);
        });

        status.textContent = "Agents loaded. Select agent, enter password and dates.";
      } catch (err) {
        status.textContent = "Failed to load agents: " + err.message;
      }
    }

    function runReport() {
      const agent = document.getElementById('agent').value.trim();
      const password = document.getElementById('password').value.trim();
      const from  = document.getElementById('from').value;
      const to    = document.getElementById('to').value;
      const status = document.getElementById('status');
      const btn    = document.getElementById('runBtn');

      if (!agent || !password || !from || !to) {
        status.textContent = "Please select Agent, enter Password, From and To dates.";
        return;
      }

      status.textContent = "Running...";
      btn.disabled = true;

      const url = `${SCRIPT_URL}?agent=${encodeURIComponent(agent)}&from=${from}&to=${to}&password=${encodeURIComponent(password)}`;

      fetch(url)
        .then(r => safeJson(r))
        .then(data => {
          if (!data.ok) {
            status.textContent = "Error: " + (data.error || "Unknown error");
            return;
          }

          renderSummary(data);
          renderCallsGrouped(data.calls);
          status.textContent = "Done.";
        })
        .catch(err => {
          status.textContent = "Failed: " + err.message;
        })
        .finally(() => {
          btn.disabled = false;
        });
    }

    function renderSummary(data) {
      const summaryDiv = document.getElementById('summary');
      summaryDiv.style.display = 'block';

      summaryDiv.innerHTML = `
        <h2>Performance Summary</h2>
        <table>
          <tr>
            <td style="font-weight:bold; width:130px;">Agent</td>
            <td>${data.agent}</td>
          </tr>
          <tr>
            <td style="font-weight:bold;">Total audits</td>
            <td>${data.totalAudits}</td>
          </tr>
          <tr>
            <td style="font-weight:bold;">Average score</td>
            <td>${data.averageScore}%</td>
          </tr>
          <tr>
            <td style="font-weight:bold;">Period</td>
            <td>${data.period}</td>
          </tr>
        </table>
      `;
    }

    function renderCallsGrouped(calls) {
      const callsDiv = document.getElementById('calls');
      callsDiv.style.display = 'block';

      calls = (calls || []).filter(c => {
        const q = (c.queryType || "").toLowerCase();
        return q !== "idle call";
      });

      if (!calls || calls.length === 0) {
        callsDiv.innerHTML = "<h2>Call-by-call breakdown</h2><p>No calls in this period.</p>";
        return;
      }

      const groups = {};
      let totalGood = 0;
      let totalIssues = 0;
      const allIssueTexts = [];

      calls.forEach(c => {
        const category = c.queryType || "Other";
        if (!groups[category]) groups[category] = [];
        groups[category].push(c);
      });

      let html = '<h2>Call-by-call breakdown</h2>';

      Object.keys(groups).forEach(cat => {
        const list = groups[cat];
        html += `
          <div class="category-header">
            <span>${cat.toUpperCase()}</span>
            <span class="count">${list.length} calls</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>SL No</th>
                <th>Category</th>
                <th>Status</th>
                <th>Feedback</th>
              </tr>
            </thead>
            <tbody>
        `;

        list.forEach(c => {
          const score = typeof c.score === "number" ? c.score : parseFloat(c.score || "0");
          let statusText = "";
          let rowClass = "";
          if (!isNaN(score) && score >= 90) {
            statusText = "✅ Good";
            rowClass = "good-row";
            totalGood++;
          } else {
            statusText = "❌ Issues";
            rowClass = "issue-row";
            totalIssues++;
            if (c.feedback) {
              allIssueTexts.push(c.feedback);
            }
          }

          html += `
            <tr class="${rowClass}">
              <td style="text-align:center;">${c.slNo}</td>
              <td>${c.queryType || ""}</td>
              <td style="text-align:center;">${statusText}</td>
              <td>${(c.feedback || "").replace(/\\n/g, "<br>")}</td>
            </tr>
          `;
        });

        html += "</tbody></table>";
      });

      callsDiv.innerHTML = html;
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
