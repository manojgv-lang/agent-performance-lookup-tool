<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>Agent QA Report</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 16px; }
      label { display:block; margin-top:8px; }
      select,input { margin-top:4px; }
      button { margin-top:10px; }
      #status { margin-top:8px; font-size:12px; color:#555; }
      table { border-collapse: collapse; margin-top:12px; width:100%; font-size:12px; }
      th,td { border:1px solid #ccc; padding:4px; }
    </style>
  </head>
  <body>
    <h2>Agent QA Report</h2>

    <label>Agent
      <select id="agent">
        <option value="">Loading...</option>
      </select>
    </label>

    <label>From
      <input id="from" type="date">
    </label>

    <label>To
      <input id="to" type="date">
    </label>

    <button onclick="runReport()">Generate</button>
    <div id="status">Waiting...</div>

    <div id="summary"></div>
    <div id="calls"></div>

    <script>
      // Use the same /exec URL as your backend (the one that returns JSON for ?listAgents=1)
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxRVrkW6BJdsSy5GyJO2NIR16cjvlnSZdm5tVIgUINKnf69FubMapgLD7opXgOqDcZG/exec";

      async function safeJson(res) {
        const text = await res.text();
        return JSON.parse(text);
      }

      async function loadAgents() {
        const status = document.getElementById("status");
        const sel = document.getElementById("agent");
        status.textContent = "Loading agents...";

        try {
          const res = await fetch(SCRIPT_URL + "?listAgents=1");
          const data = await safeJson(res);
          if (!data.ok) {
            status.textContent = "Error: " + (data.error || "Unknown");
            return;
          }
          sel.innerHTML = '<option value="">Select agent...</option>';
          (data.agents || []).forEach(a => {
            const opt = document.createElement("option");
            opt.value = a;
            opt.textContent = a;
            sel.appendChild(opt);
          });
          status.textContent = "Agents loaded.";
        } catch (err) {
          status.textContent = "Failed to load agents: " + err.message;
        }
      }

      async function runReport() {
        const agent = document.getElementById("agent").value;
        const from  = document.getElementById("from").value;
        const to    = document.getElementById("to").value;
        const status = document.getElementById("status");
        const summary = document.getElementById("summary");
        const callsDiv = document.getElementById("calls");

        if (!agent || !from || !to) {
          status.textContent = "Select agent and dates.";
          return;
        }

        status.textContent = "Running...";

        try {
          const url = SCRIPT_URL + `?agent=${encodeURIComponent(agent)}&from=${from}&to=${to}`;
          const res = await fetch(url);
          const data = await safeJson(res);

          if (!data.ok) {
            status.textContent = "Error: " + (data.error || "Unknown");
            return;
          }

          summary.innerHTML = `
            <h3>Summary</h3>
            <p><b>Agent:</b> ${data.agent}<br>
               <b>Total audits:</b> ${data.totalAudits}<br>
               <b>Average score:</b> ${data.averageScore}%<br>
               <b>Period:</b> ${data.period}</p>
          `;

          const rows = (data.calls || []).map(c => `
            <tr>
              <td>${c.slNo || ""}</td>
              <td>${c.queryType || ""}</td>
              <td>${c.score}</td>
              <td>${(c.feedback || "").replace(/\n/g,"<br>")}</td>
            </tr>
          `).join("");

          callsDiv.innerHTML = `
            <h3>Calls</h3>
            <table>
              <thead>
                <tr>
                  <th>SL No</th>
                  <th>Category</th>
                  <th>Score</th>
                  <th>Feedback</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          `;

          status.textContent = "Done.";
        } catch (err) {
          status.textContent = "Failed: " + err.message;
        }
      }

      window.addEventListener("load", loadAgents);
    </script>
  </body>
</html>
