<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Agent QA Report</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 20px; }
    .card { max-width: 900px; margin: 0 auto; padding: 24px; border-radius: 16px; background: #f7f9ff; }
    .row { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .row > div { flex: 1 1 200px; }
    label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 4px; }
    input[type="date"] { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; }
    button { padding: 10px 16px; background: #2563eb; color: white; border: none; border-radius: 999px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.6; cursor: default; }
    #status { margin-top: 10px; font-size: 13px; color: #444; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
    th, td { padding: 8px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #eef2ff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Agent QA Report</h2>
    <p>This dashboard shows only your QA data (based on your login).</p>

    <div class="row">
      <div>
        <label for="from">From Date</label>
        <input id="from" type="date" />
      </div>
      <div>
        <label for="to">To Date</label>
        <input id="to" type="date" />
      </div>
      <div style="align-self:flex-end;">
        <button id="runBtn" onclick="runReport()">Generate Report</button>
      </div>
    </div>

    <div id="status"></div>

    <h3>Summary</h3>
    <div id="summary"></div>

    <h3>Calls</h3>
    <div id="calls"></div>
  </div>

  <script>
    // 1) PUT YOUR SCRIPT URL HERE (exactly as from the Apps Script deployment)
    const SCRIPT_URL = "https://script.google.com/a/macros/voltmoney.in/s/AKfycbxcwCNPdtATTa25ZVxbeSER9vUuNjTTtEq3ozCojjquuVBThO6CinpelbSMrZqm3IfVFw/exec";

    async function safeJson(res) {
      const text = await res.text();
      try { return JSON.parse(text); }
      catch {
        throw new Error("Not JSON: " + text.slice(0, 120));
      }
    }

    function runReport() {
      const from = document.getElementById('from').value;
      const to   = document.getElementById('to').value;
      const statusEl = document.getElementById('status');
      const btn = document.getElementById('runBtn');

      if (!from || !to) {
        statusEl.textContent = "Please select both From and To dates.";
        return;
      }

      statusEl.textContent = "Running...";
      btn.disabled = true;

      const url = `${SCRIPT_URL}?from=${from}&to=${to}`;

      fetch(url)
        .then(r => safeJson(r))
        .then(data => {
          if (!data.ok) {
            statusEl.textContent = "Error: " + (data.error || "Unknown error");
            document.getElementById('summary').innerHTML = "";
            document.getElementById('calls').innerHTML = "";
            return;
          }
          renderSummary(data);
          renderCalls(data.calls || []);
          statusEl.textContent = "Done.";
        })
        .catch(err => {
          statusEl.textContent = "Failed: " + err.message;
          document.getElementById('summary').innerHTML = "";
          document.getElementById('calls').innerHTML = "";
        })
        .finally(() => {
          btn.disabled = false;
        });
    }

    function renderSummary(data) {
      const el = document.getElementById('summary');
      const agent = data.agent || "Unknown";
      const total = data.total_calls || data.total || 0;
      const avg   = data.avg_score || data.average_score || 0;

      el.innerHTML = `
        <p><strong>Agent:</strong> ${agent}</p>
        <p><strong>Total calls:</strong> ${total}</p>
        <p><strong>Average score:</strong> ${avg}</p>
      `;
    }

    function renderCalls(calls) {
      const el = document.getElementById('calls');
      if (!calls.length) {
        el.innerHTML = "<p>No calls in this date range.</p>";
        return;
      }

      const rows = calls.map(c => `
        <tr>
          <td>${c.date || ""}</td>
          <td>${c.ticket_id || ""}</td>
          <td>${c.channel || ""}</td>
          <td>${c.score != null ? c.score : ""}</td>
        </tr>
      `).join("");

      el.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Ticket</th>
              <th>Channel</th>
              <th>Score</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
